name: Build Mod Menu ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Unzip Project
        run: |
          unzip -o Android-Mod-Menu-5.0.zip

      - name: Compile Library
        run: |
          BUILD_DIR=$(find . -name "Android.mk" -exec dirname {} \;)
          cd "$BUILD_DIR"
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build

      - name: Collect Output
        run: |
          mkdir -p output
          find . -name "*.so" -exec cp {} output/ \;

      - name: Upload Compiled .so Library
        uses: actions/upload-artifact@v4
        with:
          name: libMyModMenu-arm64
          path: output/
