name: Build Mod Menu ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Unzip Project & Build
        run: |
          unzip Android-Mod-Menu-5.0.zip
          cd Android-Mod-Menu-5.0/app/src/main
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build

      - name: Upload Compiled .so Library
        uses: actions/upload-artifact@v4
        with:
          name: libMyModMenu-arm64
          path: Android-Mod-Menu-5.0/app/src/main/libs/arm64-v8a/libMyModMenu.so
          
