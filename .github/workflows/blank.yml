name: Build Mod Menu ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Android NDK
        uses: nsetup/setup-sdk@v1
        with:
          ndk-version: '25.2.9519653'

      - name: Unzip Project & Build
        run: |
          unzip Android-Mod-Menu-5.0.zip
          cd Android-Mod-Menu-5.0/app/src/main
          $ANDROID_NDK_HOME/ndk-build

      - name: Upload Compiled .so Library
        uses: actions/upload-artifact@v3
        with:
          name: libMyModMenu-arm64
          path: Android-Mod-Menu-5.0/app/src/main/libs/arm64-v8a/libMyModMenu.so
          
