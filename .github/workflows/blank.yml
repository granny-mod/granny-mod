name: Build Mod Menu ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NDK
        run: |
          sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: Unzip Project & Build
        run: |
          unzip Android-Mod-Menu-5.0.zip
          PROJECT_DIR=$(find . -maxdepth 2 -type f -name "Android.mk" | head -n 1 | xargs dirname | xargs dirname)
          cd "$PROJECT_DIR"
          $ANDROID_HOME/ndk/25.2.9519653/ndk-build

      - name: Locate and Prepare Output
        run: |
          mkdir -p output_lib
          find . -name "*.so" -exec cp {} output_lib/ \;

      - name: Upload Compiled .so Library
        uses: actions/upload-artifact@v4
        with:
          name: libMyModMenu-arm64
          path: output_lib/
